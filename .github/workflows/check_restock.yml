name: GTA6 Vinyl Restock Checker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: pip install requests

      - name: Verfuegbarkeit pruefen
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python restock_checker.py

      - name: Status-Datei speichern
        run: |
          git config user.name "restock-bot"
          git config user.email "restock-bot@users.noreply.github.com"
          git add last_state.txt
          git diff --staged --quiet || git commit -m "Status-Update"
          git push
